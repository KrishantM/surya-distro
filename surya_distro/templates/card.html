<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width={{width}}">
<title>{{name}}</title>
<style>
{{{base_css}}}
main { position: absolute; inset: 0; padding: calc(var(--u) * 6.5); display: flex; flex-direction: column; gap: calc(var(--u) * 3); }
header { display: flex; align-items: center; gap: calc(var(--u) * 1.6); }
header .mark { width: calc(var(--u) * 5.6); height: calc(var(--u) * 5.6); font-size: calc(var(--u) * 3.4); }
header .brand { font-weight: 700; font-size: calc(var(--u) * 3.1); letter-spacing: -.01em; }
header .url { margin-left: auto; font-family: var(--mono); font-size: calc(var(--u) * 2.3); color: var(--muted); }
.rule { height: calc(var(--u) * .35); width: calc(var(--u) * 9); background: var(--accent); border-radius: 99px; }
.body { flex: 1; min-height: 0; display: flex; gap: calc(var(--u) * 4); }
.copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 3); }
h1 { flex: 1; min-height: 0; overflow: hidden; font-family: var(--display); font-weight: 750; letter-spacing: -.02em;
  line-height: 1.08; font-size: calc(var(--u) * {{h1_size}}); display: flex; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 1.2); }
.chip { border: calc(var(--u) * .2) solid var(--line); border-radius: 99px; padding: calc(var(--u) * .9) calc(var(--u) * 2);
  font-size: calc(var(--u) * 2.3); color: var(--fg); background: var(--panel); white-space: nowrap; }
.code { padding: calc(var(--u) * 2) calc(var(--u) * 2.6); font-size: calc(var(--u) * 2.35); }
.foot { display: flex; align-items: center; gap: calc(var(--u) * 2); color: var(--muted); font-size: calc(var(--u) * 2.3); }
.foot .tag { border: calc(var(--u) * .2) solid var(--line); border-radius: 99px; padding: calc(var(--u) * .5) calc(var(--u) * 1.6); }
.shot { flex: 0 0 46%; display: flex; align-items: center; }
.shot .win { width: 100%; background: var(--panel); border: calc(var(--u) * .2) solid var(--line); border-radius: calc(var(--u) * 1.4); overflow: hidden; }
.shot .bar { height: calc(var(--u) * 2.6); border-bottom: calc(var(--u) * .2) solid var(--line); display: flex; align-items: center; gap: calc(var(--u) * .8); padding-left: calc(var(--u) * 1.2); }
.shot .bar i { width: calc(var(--u) * .9); height: calc(var(--u) * .9); border-radius: 50%; background: var(--line); display: block; }
.shot img { display: block; width: 100%; height: auto; max-height: calc(var(--u) * 52); object-fit: cover; object-position: top left; }
</style></head>
<body class="{{variant}}">
<main>
  <header><span class="mark">{{initial}}</span><span class="brand">{{name}}</span><span class="url">{{url_display}}</span></header>
  <div class="rule"></div>
  <div class="body">
    <div class="copy">
      <h1 data-fit>{{tagline}}</h1>
      {{{chips_html}}}
      {{{code_html}}}
      {{{foot_html}}}
    </div>
    {{{shot_html}}}
  </div>
</main>
<script>{{{fit_js}}}</script>
</body></html>
