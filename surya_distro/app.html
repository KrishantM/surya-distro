<style nonce="__NONCE__">

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

a { color: var(--accent); text-underline-offset: 2px; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.i { flex: none; display: block; }
.grow { flex: 1; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); height: 100vh; height: 100dvh; }

.rail { display: flex; flex-direction: column; gap: 1px; padding: 16px 10px 10px; border-right: 1px solid var(--line); background: var(--rail); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 14px; font-size: 14px; font-weight: 600; letter-spacing: -.012em; color: var(--ink); text-decoration: none; }
.nav { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 9px; border: 0; border-radius: var(--r-s); background: none; color: var(--ink-2); cursor: pointer; text-align: left; font-size: 13.5px; font-weight: 500; text-decoration: none; white-space: nowrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: var(--r-s); background: var(--active); cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 550; text-decoration: none; color: var(--ink); }

.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.input { width: 100%; padding: 8px 11px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--field); outline: none; }
.input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }

.card + .card { margin-top: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.grid .card + .card { margin-top: 0; }
.launch { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; }

.pips { display: flex; gap: 4px; }

.next b { font-weight: 600; }

.chip { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 11px; background: var(--hover); color: var(--ink-2); font-size: 11.5px; font-weight: 550; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }

.chip.gold { background: var(--accent-soft); color: var(--accent); }
.chip.mono { font-family: var(--mono); font-weight: 500; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--hover); gap: 2px; flex-wrap: wrap; }

.flow { list-style: none; margin: 0; padding: 0; }
.flow li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.flow li:first-child { border-top: 0; }
.flow .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--active); color: var(--ink-3); font-size: 11px; font-weight: 650; }

.steps li { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps b { font-weight: 600; }
.steps span { color: var(--ink-2); font-size: 13px; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 9px 12px; font-size: 11.5px; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }

.score { display: inline-block; min-width: 44px; padding: 1px 7px; border-radius: 7px; font-weight: 650; text-align: center; font-variant-numeric: tabular-nums; background: var(--hover); }
.score.pos { background: var(--good-soft); color: var(--good); } .score.neg { background: var(--bad-soft); color: var(--bad); }
.bar { position: relative; width: 110px; height: 8px; border-radius: 4px; background: var(--hover); }

.bar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line-2); }

.banner { display: flex; gap: 10px; padding: 11px 13px; margin-bottom: 14px; border: 1px solid var(--accent-line); border-radius: var(--r-s); background: var(--accent-soft); font-size: 13px; line-height: 1.45; }
.banner .i { margin-top: 1px; color: var(--accent); }
.banner.bad { border-color: var(--bad); background: var(--bad-soft); } .banner.bad .i { color: var(--bad); }
.banner.good { border-color: var(--good); background: var(--good-soft); } .banner.good .i { color: var(--good); }
.banner > div { min-width: 0; }

.cmd { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 11px; border-radius: var(--r-s); background: var(--sunken); border: 1px solid var(--line); max-width: 100%; }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; padding: 5px 0; }
.lock { display: grid; gap: 8px; padding: 14px 16px; border: 1px dashed var(--line-2); border-radius: var(--r); background: var(--surface); }
.lock h3 { font-size: 13.5px; display: flex; gap: 7px; align-items: center; }
.lock p { margin: 0; color: var(--ink-2); font-size: 13px; max-width: 70ch; }

.rule { padding: 12px 0; border-top: 1px solid var(--line); }
.rule:first-of-type { border-top: 0; }
.rule .txt { font-weight: 550; margin-bottom: 5px; }

.rule.old .txt { text-decoration: line-through; color: var(--ink-3); font-weight: 450; }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; padding: 4px 0; list-style: none; display: inline-flex; gap: 5px; align-items: center; }

details[open] > summary::before { content: "-"; }

.receipt { margin: 6px 0 2px; padding: 10px 12px; border-radius: var(--r-s); background: var(--hover); font-size: 12.5px; display: grid; gap: 5px; }
.receipt .nums { display: flex; gap: 16px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.receipt .nums span b { font-weight: 650; }
.change { display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
.change:first-child { border-top: 0; }
.change .before { color: var(--ink-3); text-decoration: line-through; }
.kind { display: inline-block; min-width: 76px; text-align: center; padding: 1px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 650; }
.kind.added, .kind.restored { background: var(--add-bg); color: var(--add-ink); }
.kind.changed { background: var(--accent-soft); color: var(--accent); }
.kind.superseded { background: var(--del-bg); color: var(--del-ink); }
pre.diff { margin: 6px 0 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r-s); overflow-x: auto; font: 12px/1.55 var(--mono); background: var(--surface); }
pre.diff span { display: block; padding: 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.55em; }
pre.diff .add { background: var(--add-bg); color: var(--add-ink); } pre.diff .del { background: var(--del-bg); color: var(--del-ink); } pre.diff .hunk { background: var(--hunk-bg); color: var(--ink-3); }

.split { display: grid; grid-template-columns: minmax(230px, 280px) minmax(0, 1fr); gap: 22px; align-items: start; }
.dlist { display: grid; gap: 2px; }
.drow { display: block; text-decoration: none; color: var(--ink); width: 100%; padding: 9px 11px; border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer; }
.drow:hover { background: var(--hover); }
.drow[aria-current="true"] { background: var(--active); }
.drow b { display: block; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow .m { display: flex; gap: 6px; margin-top: 4px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); }
.state { height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; background: var(--hover); color: var(--ink-2); }
.state.approved { background: var(--good-soft); color: var(--good); } .state.posted { background: var(--accent-soft); color: var(--accent); } .state.changed { background: var(--warn-soft); color: var(--warn); }
.field { margin: 0 0 16px; }
.field .fh label { white-space: nowrap; }
.field .fh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field .fh .counts { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.field .fh .counts.over { color: var(--bad); font-weight: 650; }
.ed { position: relative; border-radius: var(--r-s); background: var(--field); border: 1px solid var(--line-2); }
.ed:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.field.err .ed { border-color: var(--bad); }
.ed .back, .ed textarea { margin: 0; padding: 10px 12px; font: 13px/1.65 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; tab-size: 4; letter-spacing: 0; border: 0; width: 100%; }
.ed .back { position: absolute; inset: 0; overflow: hidden; color: transparent; pointer-events: none; }
.ed textarea { position: relative; display: block; resize: none; overflow: hidden; background: transparent; outline: none; min-height: 40px; }
.ed textarea[readonly] { color: var(--ink-2); }
mark.fill { color: transparent; background: var(--fill-bg); box-shadow: 0 0 0 1px var(--fill-line); border-radius: 3px; }
.legend-fill { display: inline-block; width: 22px; height: 11px; border-radius: 3px; background: var(--fill-bg); box-shadow: 0 0 0 1px var(--fill-line); vertical-align: -1px; margin-right: 4px; }
.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.issues li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 13px; padding: 7px 10px; border-radius: var(--r-s); background: var(--hover); }
.issues li.error { background: var(--bad-soft); } .issues li.warning { background: var(--warn-soft); }
.issues li.error .i { color: var(--bad); } .issues li.warning .i { color: var(--warn); }
.issues .f { font: 12px var(--mono); color: var(--ink-2); margin-right: 6px; }
.savebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 18px; }
.dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: inline-block; }

.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.asset { padding: 0; overflow: hidden; }
.asset .view { background: var(--sunken); display: grid; place-items: center; min-height: 140px; }
.asset .view img, .asset .view video { display: block; width: 100%; height: auto; max-height: 300px; object-fit: contain; }
.asset .body { padding: 12px 14px 14px; display: grid; gap: 8px; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; margin: 0; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; overflow-wrap: anywhere; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
.tile { padding: 12px 14px; }
.tile .v { font-size: 24px; font-weight: 620; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--ink-2); font-size: 12.5px; }
.chart { margin-top: 12px; }
.ch3 { font-size: 13.5px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font: 11px var(--sans); fill: var(--ink-3); }
.chart .grid-l { stroke: var(--line); } .chart .mk { stroke: var(--ink-3); stroke-dasharray: 3 3; } .chart text.mk { fill: var(--ink-2); stroke: none; font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
