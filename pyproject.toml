[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "surya-distro"
version = "0.3.0"
description = "Studies which posts work in your repo's space, drafts a launch that follows the evidence, then measures each post and learns from it. It never posts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
surya-distro = "surya_distro.cli:console"

[project.urls]
Repository = "https://github.com/KrishantM/surya-distro"

[tool.setuptools]
packages = ["surya_distro"]

[tool.setuptools.package-data]
surya_distro = ["data/*.json", "templates/*"]
